[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.49.0", features = ["full"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
ulid = "1.2.1"
tower-http = { version = "0.6.8", features = ["trace"] }

[dev-dependencies]
axum-test = "18.7.0"
http-body-util = "0.1.3"
tower-http = "0.6.8"
rand = "0.8"
